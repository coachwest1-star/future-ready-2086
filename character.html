<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Professional</title><link rel="stylesheet" href="css/main.css"></head><body><div class="top"><div class="brand"><div class="logo">FR</div><div><b>CREATE YOUR PROFESSIONAL</b><div class="sub">CAREER ONBOARDING</div></div></div></div><div class="wrap grid2"><div class="panel"><h2>Professional Identity</h2><p class="muted">Create the person who will enter the Future Ready Career Center.</p><label>Name<br><input id="name" style="width:100%;margin:8px 0"></label><label>Work style<br><select id="style" style="width:100%;margin:8px 0"><option>Practical problem solver</option><option>Creative designer</option><option>Analytical investigator</option><option>Team leader</option></select></label></div><div class="panel"><h2>Professional Profile</h2><div style="font-size:90px;text-align:center">🧑‍🔧</div><p class="muted">Your professional identity follows you across career pathways.</p><button class="btn" id="save">CONTINUE TO CAREER CENTER</button></div></div><script src="js/storage.js"></script><script>let p=FR.get();name.value=p.name||"";style.value=p.style||"Practical problem solver";save.onclick=()=>{FR.patch({name:name.value.trim()||"Future Ready Student",style:style.value});location.href="career-center.html"}</script></body></html>
