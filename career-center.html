<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Center</title><link rel="stylesheet" href="css/main.css"></head><body><div class="top"><div class="brand"><div class="logo">FR</div><div><b>FUTURE READY CAREER CENTER</b><div class="sub" id="who"></div></div></div><a href="profile.html">PROFILE</a></div><div class="hero" style="padding-bottom:10px"><div class="sub">SELECT A CAREER DIVISION</div><h1 style="font-size:34px">WHERE WILL YOU REPORT?</h1><p>Your professional can explore more than one pathway. Training and completed work orders are saved on this device.</p></div><div class="cards" id="cards"></div><script src="js/storage.js"></script><script>who.textContent=(FR.get().name||"STUDENT")+" // CAREER ID ACTIVE";fetch("data/careers.json").then(r=>r.json()).then(ds=>cards.innerHTML=ds.map(x=>'<div class="card" onclick="choose(\''+x.id+'\')"><div style="font-size:35px">'+x.icon+'</div><h3>'+x.name+'</h3><p class="muted">'+x.description+'</p><span class="sub">'+x.role+'</span></div>').join(""));function choose(id){FR.patch({career:id});location.href="training.html"}</script></body></html>
