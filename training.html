<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Training</title><link rel="stylesheet" href="css/main.css"></head><body><div class="top"><div class="brand"><div class="logo">FR</div><div><b>TRAINING CENTER</b><div class="sub">PREPARE BEFORE THE WORK ORDER</div></div></div><div class="yellow">6 TRAINING CREDITS</div></div><div class="wrap"><div class="panel"><h2>Select Initial Training</h2><p class="muted">Choose up to 6 credits. Preparation can unlock advantages, but evidence and judgment still matter.</p><div id="list" class="cards" style="grid-template-columns:repeat(3,1fr);margin:20px 0"></div><p>Credits remaining: <b id="credits" class="yellow">6</b></p><button class="btn" id="go">ENTER CAREER DIVISION</button></div></div><script src="js/storage.js"></script><script>let p=FR.get(),left=6,sel=[];fetch("data/training.json").then(r=>r.json()).then(d=>{window.a=d[p.career]||[];list.innerHTML=a.map((x,i)=>'<div class="card" id="t'+i+'" onclick="pick('+i+','+x[1]+')"><h3>'+x[0]+'</h3><span class="yellow">'+x[1]+' credits</span></div>').join("")});function pick(i,c){let j=sel.indexOf(i);if(j>=0){sel.splice(j,1);left+=c}else if(left>=c){sel.push(i);left-=c}else return;credits.textContent=left;document.getElementById("t"+i).style.borderColor=sel.includes(i)?"#62ffad":"#275168"}go.onclick=()=>{FR.patch({training:sel.map(i=>a[i][0])});location.href="mission.html"}</script></body></html>
