<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Career Profile</title><link rel="stylesheet" href="css/main.css"><style>.profileGrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.credential{display:inline-block;border:1px solid #ffd45d;border-radius:8px;padding:10px;margin:5px;color:#ffd45d}.stat{font-size:28px;color:#56eaff}.bar{height:10px;background:#102235;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#62ffad}@media(max-width:750px){.profileGrid{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="brand"><div class="logo">FR</div><div><b>CAREER PROFILE</b><div class="sub">FUTURE READY ID // BUILD 7</div></div></div><a href="career-center.html">CAREER CENTER</a></div><div class="wrap profileGrid"><div class="panel"><div class="sub">PROFESSIONAL</div><h1 id="n"></h1><p id="style" class="yellow"></p><div class="stat" id="level"></div><p id="xp"></p><div class="bar"><i id="xpbar"></i></div><h3>TRAINING</h3><p id="training" class="muted"></p></div><div class="panel"><div class="sub">EARNED CREDENTIALS</div><h2>CAREER BADGES</h2><div id="credentials"></div><p class="muted" id="credHelp"></p></div><div class="panel" style="grid-column:1/-1"><div class="sub">WORK ORDER HISTORY</div><h2>PERFORMANCE</h2><div id="history"></div><br><button class="btn" onclick="if(confirm('Reset this Future Ready profile and all progress?')){FR.reset();location.href='index.html'}">RESET PROFILE</button></div></div><script src="js/storage.js"></script><script>
let p=FR.get(),lv=FR.level(p.xp||0),floor=[0,0,200,500,900][lv]||0,next=FR.nextXP(lv);n.textContent=p.name||"Future Ready Student";style.textContent=p.style||"";level.textContent="LEVEL "+lv+" // "+FR.levelName(lv);xp.textContent=(p.xp||0)+" XP"+(lv<4?" • "+next+" XP unlocks next level":" • Highest current level");xpbar.style.width=(lv>=4?100:Math.max(0,Math.min(100,((p.xp||0)-floor)/(next-floor)*100)))+"%";training.textContent=(p.training||[]).join(" • ")||"No current training selected";let cr=p.credentials||[];credentials.innerHTML=cr.length?cr.map(x=>'<span class="credential">◆ '+x+'</span>').join(""):"<p class='muted'>Complete work orders with strong performance to earn credentials.</p>";credHelp.textContent=cr.length+" credential"+(cr.length===1?"":"s")+" earned";let prog=p.progress||{};history.innerHTML=Object.keys(prog).length?Object.entries(prog).map(([k,v])=>'<div class="panel" style="margin:8px 0"><b>'+FR.careerNames[k]+'</b> <span class="yellow">'+(v.best||0)+'% best</span><div class="sub">'+(v.attempts||1)+' attempt(s) • Technical '+v.technical+' • AI '+v.ai+' • Verification '+v.verification+' • Judgment '+v.judgment+'</div></div>').join(""):"<p class='muted'>No completed work orders yet.</p>";
</script></body></html>
